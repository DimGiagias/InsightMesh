[project]
name = "insightmesh"
version = "0.1.0"
description = "Multi-agent research assistant built on LangGraph: AI analyst personas interview experts backed by web and Wikipedia search, then compile their findings into a sourced report."
readme = "README.md"
authors = [
    { name = "DimGiagias" }
]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
    "wikipedia>=1.4.0",
]

[project.scripts]
insightmesh = "insightmesh:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
]
